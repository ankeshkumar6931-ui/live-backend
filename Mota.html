<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <!-- Pinch Zoom in / Zoom out रोकने के लिए Viewport सेटिंग्स -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Lakshya</title>
    
    <style>
        /* पूरे पेज पर टेक्स्ट सिलेक्शन और जूम रोकना */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none;    /* Firefox */
            -ms-user-select: none;     /* IE/Edge */
            user-select: none;         /* Standard */
            touch-action: pan-x pan-y; /* Double-tap zoom रोकता है */
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        /* Heading Style */
        .header-title {
            font-size: 2.5rem;
            color: #d63031;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 40px;
            font-weight: 800;
        }

        /* Gift Containers */
        .gifts-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Gift Box Wrapper */
        .gift-box {
            position: relative;
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gift-box:hover {
            transform: scale(1.05);
        }

        /* Gift Base */
        .gift-body {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background-color: #e74c3c;
            border-radius: 8px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        /* Gift Ribbon Vertical */
        .gift-body::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 100%;
            background-color: #f1c40f;
        }

        /* Gift Lid (ढक्कन) */
        .gift-lid {
            position: absolute;
            top: 15px;
            left: -5px;
            width: 110px;
            height: 25px;
            background-color: #c0392b;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        /* Lid Ribbon Vertical */
        .gift-lid::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 100%;
            background-color: #f1c40f;
        }

        /* Ribbon Bow (ऊपर का फूल) */
        .gift-bow {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 15px;
            background-color: #f1c40f;
            border-radius: 15px 15px 0 0;
        }

        /* Open Animation */
        .gift-box.open .gift-lid {
            transform: translateY(-50px) rotate(-15deg);
            opacity: 0.8;
        }

        .gift-box.open {
            animation: bounceOut 0.8s forwards;
        }

        @keyframes bounceOut {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .gift-label {
            margin-top: 15px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.1rem;
        }

        .gift-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Video Modal (Pop-up) Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 800px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-content video {
            width: 100%;
            max-height: 80vh;
            display: block;
            outline: none;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            background: rgba(0,0,0,0.5);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Main Heading -->
    <h1 class="header-title">HAPPY BIRTHDAY LAKSHYA — MOTA</h1>

    <!-- Gifts Section -->
    <div class="gifts-container">
        
        <!-- Gift 1 -->
        <div class="gift-wrapper">
            <div class="gift-box" onclick="openGift(this, 'https://res.cloudinary.com/vijvpsmy/video/upload/v1793633671/skedqexmczh6ygxsjssq.mp4')">
                <div class="gift-lid">
                    <div class="gift-bow"></div>
                </div>
                <div class="gift-body"></div>
            </div>
            <div class="gift-label">Gift 1</div>
        </div>

        <!-- Gift 2 (Updated Link) -->
        <div class="gift-wrapper">
            <div class="gift-box" onclick="openGift(this, 'https://res.cloudinary.com/vijvpsmy/video/upload/v1793633634/pb2a4uqiec36ajxjrru3.mp4')">
                <div class="gift-lid">
                    <div class="gift-bow"></div>
                </div>
                <div class="gift-body"></div>
            </div>
            <div class="gift-label">Gift 2</div>
        </div>

        <!-- Gift 3 -->
        <div class="gift-wrapper">
            <div class="gift-box" onclick="openGift(this, 'https://res.cloudinary.com/vijvpsmy/video/upload/v1793633719/s1zsqxl5nct0ai2nlf3r.mp4')">
                <div class="gift-lid">
                    <div class="gift-bow"></div>
                </div>
                <div class="gift-body"></div>
            </div>
            <div class="gift-label">Gift 3</div>
        </div>

    </div>

    <!-- Pop-up Video Modal -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <video id="popupVideo" controls autoplay playsinline></video>
        </div>
    </div>

    <script>
        // साउंड इफेक्ट (Pop Sound)
        const popAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3');

        const modal = document.getElementById('videoModal');
        const popupVideo = document.getElementById('popupVideo');

        function openGift(element, videoUrl) {
            // गिफ्ट खुलने की साउंड बजाना
            popAudio.play().catch(() => {});

            // एनीमेशन क्लास जोड़ना
            element.classList.add('open');

            // एनीमेशन खत्म होने के बाद (600ms बाद) पॉप-अप में वीडियो दिखाना
            setTimeout(() => {
                popupVideo.src = videoUrl;
                modal.style.display = 'flex';
                popupVideo.play();
                
                // गिफ्ट एनीमेशन रिसेट करना
                setTimeout(() => {
                    element.classList.remove('open');
                }, 500);
            }, 600);
        }

        // वीडियो खत्म होते ही ऑटोमेटिक पॉप-अप बंद हो जाना
        popupVideo.onended = function() {
            closeModal();
        };

        function closeModal() {
            modal.style.display = 'none';
            popupVideo.pause();
            popupVideo.src = '';
        }

        // राइट क्लिक रोकना (ताकि कोई सेलेक्ट न कर सके)
        document.addEventListener('contextmenu', event => event.preventDefault());

        // मोबाईल पर डबल टैप से जूम रोकना
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
