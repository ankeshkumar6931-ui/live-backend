<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TinyDB Name Saver</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 350px;
      text-align: center;
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 1.2rem;
    }

    .display-box {
      background-color: #eef2f5;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 600;
      color: #16a085;
      word-break: break-all;
    }

    .input-group {
      margin-bottom: 16px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #bdc3c7;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: #16a085;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #16a085;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:active {
      background-color: #117964;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>TinyDB Name Saver</h2>

    <!-- सेव हुआ नाम यहाँ दिखेगा -->
    <div class="display-box">
      सहेजा गया नाम: <span id="savedNameDisplay">कोई नाम नहीं</span>
    </div>

    <!-- टेक्स्ट इनपुट -->
    <div class="input-group">
      <input type="text" id="usernameInput" placeholder="यहाँ अपना नाम लिखें...">
    </div>

    <!-- सेव बटन -->
    <button type="button" onclick="saveName()">सेव करें (Save Name)</button>
  </div>

  <script>
    // 1. ऐप लोड होते ही डाटा लोड करने का फंक्शन
    function loadSavedName() {
      let savedName = "";

      // MIT App Inventor WebViewString चेक करें
      if (window.AppInventor && typeof window.AppInventor.getWebViewString === 'function') {
        savedName = window.AppInventor.getWebViewString();
      } else if (window.WebViewerString) {
        savedName = window.WebViewerString;
      } else {
        // ब्राउजर टेस्टिंग के लिए LocalStorage का बैकअप
        savedName = localStorage.getItem("userSavedName") || "";
      }

      // यदि पहले से कोई नाम सेव है, तो उसे टेक्स्टबॉक्स और डिस्प्ले में दिखाएं
      if (savedName && savedName !== "null" && savedName !== "undefined") {
        document.getElementById("usernameInput").value = savedName;
        document.getElementById("savedNameDisplay").innerText = savedName;
      }
    }

    // 2. बटन क्लिक पर नाम सेव करने का फंक्शन
    function saveName() {
      const inputVal = document.getElementById("usernameInput").value.trim();

      if (!inputVal) {
        alert("कृपया कोई नाम दर्ज करें!");
        return;
      }

      // स्क्रीन पर नाम तुरंत अपडेट करें
      document.getElementById("savedNameDisplay").innerText = inputVal;

      // MIT App Inventor TinyDB में WebViewString भेजें
      if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
        window.AppInventor.setWebViewString(inputVal);
      } else {
        window.WebViewerString = inputVal;
        localStorage.setItem("userSavedName", inputVal); // ब्राउजर टेस्टिंग
      }

      alert("नाम सफलतापूर्वक सेव/अपडेट हो गया!");
    }

    // पेज लोड होते ही लोड फंक्शन चलाएं
    window.onload = loadSavedName;
  </script>

</body>
</html>
