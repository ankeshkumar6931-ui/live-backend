<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Instagram...</title>
    <script>
        window.onload = function() {
            // Instagram deep link for opening app directly
            var intentUrl = "intent://user?username=petalverse.crafty_girl#Intent;package=com.instagram.android;scheme=instagram;end";
            var webUrl = "https://www.instagram.com/petalverse.crafty_girl?xtok=YTQ3NXQxOXBwemgw";

            // Try opening via Android Intent / Deep link immediately
            window.location.href = intentUrl;

            // Fallback to web link if app doesn't open
            setTimeout(function() {
                window.location.href = webUrl;
            }, 500);
        };
    </script>
</head>
<body>
</body>
</html>
